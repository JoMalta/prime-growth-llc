<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" aria-hidden="true" focusable="false">
  <!-- Abstract growth motif derived from the Prime Growth mark: rising columns + arc + arrow. Decorative only. -->
  <rect width="600" height="520" rx="8" fill="#13223a"/>
  <!-- planning sheet -->
  <rect x="48" y="56" width="504" height="408" rx="6" fill="#0f1c31"/>
  <g fill="#1c3050">
    <rect x="80" y="92" width="140" height="10" rx="5"/>
    <rect x="80" y="114" width="96" height="10" rx="5"/>
  </g>
  <!-- baseline + columns -->
  <rect x="80" y="404" width="440" height="3" rx="1.5" fill="#26406a"/>
  <g>
    <rect x="104" y="330" width="52" height="74" rx="3" fill="#1c3050"/>
    <rect x="180" y="292" width="52" height="112" rx="3" fill="#22395e"/>
    <rect x="256" y="246" width="52" height="158" rx="3" fill="#2a4570"/>
    <rect x="332" y="196" width="52" height="208" rx="3" fill="#34548a"/>
    <rect x="408" y="140" width="52" height="264" rx="3" fill="#e9edf4"/>
  </g>
  <!-- growth arc -->
  <path d="M96 352 C 210 330, 300 280, 372 214 S 466 118, 492 104" fill="none" stroke="#c9a35a" stroke-width="6" stroke-linecap="round"/>
  <path d="M470 98 L 500 100 L 492 128" fill="none" stroke="#c9a35a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0f1c31" stroke="#e3c27f" stroke-width="3">
    <circle cx="130" cy="344" r="7"/>
    <circle cx="206" cy="324" r="7"/>
    <circle cx="282" cy="292" r="7"/>
    <circle cx="358" cy="228" r="7"/>
  </g>
  <!-- side notes -->
  <g fill="#1c3050">
    <rect x="80" y="430" width="120" height="8" rx="4"/>
    <rect x="216" y="430" width="72" height="8" rx="4"/>
  </g>
</svg>
